bin = [
    { name = "hyper-bootstrap-retire", path = "src/main.rs", test = false, bench = false },
]

[package]
name = "hyper-bootstrap-retire"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/HypeR-Proj/bootstrap-retire"

[dependencies.hyper-os]
version = "=0.0.0"

[dependencies.hyper-rt]
version = "=0.0.0"
features = [
    "std",
]

[dependencies.hyper-service-ipc]
version = "=0.0.0"

[dependencies.serde_json]
version = "1"

[dependencies.hyper-bootstrap-handoff]
version = "=0.0.0"

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    "cfg(target_os, values(\"hyper\"))",
]

[workspace]
members = [
    ".",
]
resolver = "3"
